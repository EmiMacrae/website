<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Boo Crew</title>
  <style>
    /* Center the page content and use a full viewport height */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;       /* vertical center */
      justify-content: center;   /* horizontal center */
      flex-direction: column;    /* stack the circle and the list */
      text-align: center;
      background-image: url("https://github.com/EmiMacrae/website/blob/main/Terminal%20City_%20Extraordinary%20Photos%20of%20Vancouver%201972-1982%20-%20Flashbak.jpg?raw=true");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover; /* previously empty */
    }

    /* Circle: center its contents with flex */
    .circle {
      width: 500px;
      height: 500px;
      border-radius: 50%;
      font-size: 50px;
      color: #fff;
      background: rgba(0,0,0,0.45);

      display: flex;            /* make it a flex container */
      align-items: center;      /* vertical center of text */
      justify-content: center;  /* horizontal center of text */

      /* if you want the element centered inside a non-flex parent use margin: 0 auto; */
      margin: 0 auto;
      text-align: center;       /* fallback */
    }

    ul {
      display: flex;
      gap: 20px;
      justify-content: center;
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    li {
      display: inline-block; /* note the semicolon */
    }
  </style>
</head>
<body>
  <h1 class="circle">The Boo Crew</h1>
  <ul>
    <li>Local Exorcists</li>
    <li>Report A Ghost</li>
    <li>Ghost Types</li>
  </ul>
</body>
</html>
